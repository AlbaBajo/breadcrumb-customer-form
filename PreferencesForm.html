
<div class="form-section">
  <h3 class="mb-3">Customer Preferences</h3>
  <p class="text-muted mb-4">Enter the customer's preferences</p>
  
  <form id="preferencesForm">
    <div class="section-container">
      <h4 class="mb-3">Communication Preferences</h4>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="preferredLanguage" class="form-label">Preferred Language</label>
          <select class="form-select" id="preferredLanguage">
            <option value="" selected>Select language</option>
            <option value="english">English</option>
            <option value="spanish">Spanish</option>
            <option value="french">French</option>
            <option value="german">German</option>
            <option value="chinese">Chinese</option>
            <option value="japanese">Japanese</option>
          </select>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="communicationFrequency" class="form-label">Communication Frequency</label>
          <select class="form-select" id="communicationFrequency">
            <option value="" selected>Select frequency</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
          </select>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="subscribeNewsletter">
            <label class="form-check-label" for="subscribeNewsletter">
              Subscribe to newsletter
            </label>
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="marketingConsent">
            <label class="form-check-label" for="marketingConsent">
              Consent to marketing communications
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="section-container mt-4">
      <h4 class="mb-3">Payment Preferences</h4>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="preferredPaymentMethod" class="form-label">Preferred Payment Method</label>
          <select class="form-select" id="preferredPaymentMethod">
            <option value="" selected>Select payment method</option>
            <option value="credit_card">Credit Card</option>
            <option value="bank_transfer">Bank Transfer</option>
            <option value="paypal">PayPal</option>
            <option value="check">Check</option>
          </select>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="creditLimit" class="form-label">Credit Limit</label>
          <input type="text" class="form-control" id="creditLimit" placeholder="e.g., 5000">
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="currency" class="form-label">Currency</label>
          <select class="form-select" id="currency">
            <option value="" selected>Select currency</option>
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="CAD">CAD - Canadian Dollar</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section-container mt-4">
      <h4 class="mb-3">Account Settings</h4>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="timezone" class="form-label">Timezone</label>
          <select class="form-select" id="timezone">
            <option value="" selected>Select timezone</option>
            <option value="GMT-8">Pacific Time (GMT-8)</option>
            <option value="GMT-7">Mountain Time (GMT-7)</option>
            <option value="GMT-6">Central Time (GMT-6)</option>
            <option value="GMT-5">Eastern Time (GMT-5)</option>
            <option value="GMT">GMT</option>
            <option value="GMT+1">Central European Time (GMT+1)</option>
            <option value="GMT+8">China Standard Time (GMT+8)</option>
            <option value="GMT+9">Japan Standard Time (GMT+9)</option>
          </select>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="accountType" class="form-label">Account Type</label>
          <select class="form-select" id="accountType">
            <option value="" selected>Select account type</option>
            <option value="individual">Individual</option>
            <option value="business">Business</option>
            <option value="enterprise">Enterprise</option>
            <option value="government">Government</option>
            <option value="non_profit">Non-Profit</option>
          </select>
        </div>
        
        <div class="col-md-12 mb-3">
          <label for="tags" class="form-label">Tags (comma-separated)</label>
          <input type="text" class="form-control" id="tags" placeholder="e.g., VIP, New, Enterprise">
        </div>
      </div>
    </div>
  </form>
</div>

<script>
  // Function to collect preferences data
  function collectPreferencesData() {
    return {
      preferredLanguage: document.getElementById('preferredLanguage').value,
      communicationFrequency: document.getElementById('communicationFrequency').value,
      subscribeNewsletter: document.getElementById('subscribeNewsletter').checked,
      marketingConsent: document.getElementById('marketingConsent').checked,
      preferredPaymentMethod: document.getElementById('preferredPaymentMethod').value,
      creditLimit: document.getElementById('creditLimit').value,
      currency: document.getElementById('currency').value,
      timezone: document.getElementById('timezone').value,
      accountType: document.getElementById('accountType').value,
      tags: document.getElementById('tags').value
    };
  }
</script>
