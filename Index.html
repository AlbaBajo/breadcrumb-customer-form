    <div class="tab-content" id="mainTabContent">
      <!-- Customer Form Tab -->
      <div class="tab-content fade show active" id="form-content" role="tabpanel" aria-labelledby="form-tab">
        <div class="row">
          <div class="col-md-12">
            <!-- Steps navigation -->
            <div class="form-section">
              <ul class="nav nav-tabs" id="formSteps" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="arquitectura-tab" data-bs-toggle="tab" data-bs-target="#arquitectura" type="button" role="tab" aria-controls="arquitectura" aria-selected="true">1. Arquitectura</button>

                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="contactinfo-tab" data-bs-toggle="tab" data-bs-target="#contactinfo" type="button" role="tab" aria-controls="contactinfo" aria-selected="false">2. Contact Info</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="address-tab" data-bs-toggle="tab" data-bs-target="#address" type="button" role="tab" aria-controls="address" aria-selected="false">3. Address</button>

                  <button class="nav-link" id="aceleradores-tab" data-bs-toggle="tab" data-bs-target="#aceleradores" type="button" role="tab" aria-controls="aceleradores" aria-selected="false">4. Aceleradores</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="preferences-tab" data-bs-toggle="tab" data-bs-target="#preferences" type="button" role="tab" aria-controls="preferences" aria-selected="false">5. Preferences</button>
                </li>

                  <?!= include('ArquitecturaForm'); ?>

                    <button type="button" class="btn btn-outline-secondary" id="cancelArquitectura">Cancel</button>

      <!-- Customer List Tab -->
      <div class="tab-pane fade" id="list-content" role="tabpanel" aria-labelledby="list-tab">
        <div class="form-section">
          <h3 class="section-header">
            <span>
              <i class="bi bi-people"></i> Customer List
            </span>
          </h3>
          
          <div class="table-responsive mt-4">
            <table class="table table-striped table-bordered" id="customersTable">
              <thead class="table-primary">
                <tr>
                  <th>Customer Name</th>
                  <th>Antigüedad</th>

                  <th>Cloud</th>
                  <th>Phone</th>

<!-- Bootstrap JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Client-side JavaScript -->
<script>
  // Global variables
  let formData = {}; // Will hold all form data
  let isEditing = false; // Whether we're editing an existing customer
  let currentCustomer = null; // Current customer being edited

  // Initialize on document load
  document.addEventListener('DOMContentLoaded', function() {
    setupNavigation();
    loadCustomers();
    
    // Initialize form events
    document.getElementById('submitForm').addEventListener('click', handleFormSubmit);
    document.getElementById('cancelArquitectura').addEventListener('click', function() {
      // Go to list tab
      const listTab = document.getElementById('list-tab');
      bootstrap.Tab.getOrCreateInstance(listTab).show();
    });
  });

  // Set up tab navigation
  function setupNavigation() {
    // Handle "Next" buttons
    document.getElementById('nextToContactInfo').addEventListener('click', function() {
      if (validateArquitecturaForm()) {
        collectStepData('arquitectura');
        const contactTab = document.getElementById('contactinfo-tab');
        bootstrap.Tab.getOrCreateInstance(contactTab).show();
      }
    });

    // Handle generic Previous/Next buttons
    document.querySelectorAll('.prev-step, .next-step').forEach(button => {
      button.addEventListener('click', function() {
        const currentTabId = this.closest('.tab-pane').id;
        collectStepData(currentTabId);
        
        const targetTabId = this.getAttribute('data-target');
        const targetTab = document.getElementById(`${targetTabId}-tab`);
        bootstrap.Tab.getOrCreateInstance(targetTab).show();
        
        // If going to review, populate the review screen
        if (targetTabId === 'review') {
          populateReviewScreen();
        }
      });
    });
  }

  // Collect data from each step
  function collectStepData(stepId) {
    switch(stepId) {
      case 'arquitectura':
        Object.assign(formData, collectArquitecturaData());
        break;
      case 'contactinfo':
        Object.assign(formData, collectContactInfoData());
        break;
      case 'address':
        Object.assign(formData, collectAddressData());
        break;
      case 'aceleradores':
        formData.aceleradores = collectAceleradoresData();
        break;
      case 'preferences':
        Object.assign(formData, collectPreferencesData());
        break;
    }
  }

  // Handle form submission
  function handleFormSubmit() {
    // Collect data from all steps
    collectStepData('arquitectura');
    collectStepData('contactinfo');
    collectStepData('address');
    collectStepData('aceleradores');
    collectStepData('preferences');
    
    // Show loading indicator
    document.getElementById('submitForm').disabled = true;
    document.getElementById('submitForm').textContent = 'Submitting...';
    
    // Submit to Google Apps Script backend
    google.script.run
      .withSuccessHandler(function(response) {
        // Reset button
        document.getElementById('submitForm').disabled = false;
        document.getElementById('submitForm').textContent = 'Submit';
        
        if (response.success) {
          // Show success message
          alert(response.message);
          
          // Reset form and go to list tab
          resetForm();
          loadCustomers();
          const listTab = document.getElementById('list-tab');
          bootstrap.Tab.getOrCreateInstance(listTab).show();
        } else {
          // Show error message
          alert("Error: " + response.message);
        }
      })
      .withFailureHandler(function(error) {
        // Reset button
        document.getElementById('submitForm').disabled = false;
        document.getElementById('submitForm').textContent = 'Submit';
        
        // Show error
        alert("Error submitting form: " + error.message);
      })
      .saveCustomerData(formData, isEditing);
  }

  // Load customer list
  function loadCustomers() {
    const tableBody = document.getElementById('customersTableBody');
    tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Loading customers...</td></tr>';
    
    google.script.run
      .withSuccessHandler(function(customers) {
        tableBody.innerHTML = '';
        
        if (customers.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="7" class="text-center">No customers found</td></tr>';
          return;
        }
        
        customers.forEach(function(customer) {
          const row = document.createElement('tr');
          
          row.innerHTML = `
            <td>${customer.customerName || '-'}</td>
            <td>${customer.antiguedad || '-'}</td>
            <td>${customer.tipoLicencia || '-'}</td>
            <td>${customer.cloud || '-'}</td>
            <td>${customer.phoneNumber || '-'}</td>
            <td>${customer.alternativeEmail || '-'}</td>
            <td>
              <div class="action-btns">
                <button class="btn btn-outline-primary btn-sm view-customer" data-name="${customer.customerName}">
                  <i class="bi bi-eye"></i>
                </button>
                <button class="btn btn-outline-secondary btn-sm edit-customer" data-name="${customer.customerName}">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-outline-danger btn-sm delete-customer" data-name="${customer.customerName}">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          `;
          
          // Add event listeners
          const viewBtn = row.querySelector('.view-customer');
          viewBtn.addEventListener('click', function() {
            viewCustomer(this.getAttribute('data-name'));
          });
          
          const editBtn = row.querySelector('.edit-customer');
          editBtn.addEventListener('click', function() {
            editCustomer(this.getAttribute('data-name'));
          });
          
          const deleteBtn = row.querySelector('.delete-customer');
          deleteBtn.addEventListener('click', function() {
            deleteCustomer(this.getAttribute('data-name'));
          });
          
          tableBody.appendChild(row);
        });
      })
      .withFailureHandler(function(error) {
        tableBody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">Error loading customers: ${error.message}</td></tr>`;
      })
      .getAllCustomers();
  }

  // View customer details
  function viewCustomer(name) {
    google.script.run
      .withSuccessHandler(function(customer) {
        if (!customer) {
          alert("Customer not found");
          return;
        }
        
        // Store data and populate review screen
        formData = customer;
        
        // Switch to review tab in form
        const formTab = document.getElementById('form-tab');
        const reviewTab = document.getElementById('review-tab');
        
        bootstrap.Tab.getOrCreateInstance(formTab).show();
        bootstrap.Tab.getOrCreateInstance(reviewTab).show();
        
        // Populate review screen
        populateReviewScreen();
      })
      .withFailureHandler(function(error) {
        alert("Error loading customer: " + error.message);
      })
      .getCustomer(name);
  }

  // Edit customer
  function editCustomer(name) {
    google.script.run
      .withSuccessHandler(function(customer) {
        if (!customer) {
          alert("Customer not found");
          return;
        }
        
        // Set global variables
        formData = customer;
        isEditing = true;
        currentCustomer = customer;
        
        // Switch to form tab
        const formTab = document.getElementById('form-tab');
        const arquitecturaTab = document.getElementById('arquitectura-tab');
        
        bootstrap.Tab.getOrCreateInstance(formTab).show();
        bootstrap.Tab.getOrCreateInstance(arquitecturaTab).show();
        
        // Populate form fields with customer data
        populateFormFields(customer);
      })
      .withFailureHandler(function(error) {
        alert("Error loading customer for editing: " + error.message);
      })
      .getCustomer(name);
  }

  // Populate form fields with customer data
  function populateFormFields(customer) {
    // Arquitectura
    document.getElementById('customerName').value = customer.customerName || '';
    document.getElementById('customerName').readOnly = true; // Don't allow changing the primary key
    document.getElementById('antiguedad').value = customer.antiguedad || '';
    document.getElementById('tipoLicencia').value = customer.tipoLicencia || '';
    document.getElementById('cloud').value = customer.cloud || '';
    
    if (customer.tallaje) {
      const tallajeRadio = document.querySelector(`input[name="tallaje"][value="${customer.tallaje}"]`);
      if (tallajeRadio) tallajeRadio.checked = true;
    }
    
    document.getElementById('comments').value = customer.comments || '';
    
    // ContactInfo
    document.getElementById('phoneNumber').value = customer.phoneNumber || '';
    document.getElementById('mobileNumber').value = customer.mobileNumber || '';
    document.getElementById('workPhone').value = customer.workPhone || '';
    document.getElementById('alternativeEmail').value = customer.alternativeEmail || '';
    document.getElementById('preferredContactMethod').value = customer.preferredContactMethod || '';
    
    // Address
    document.getElementById('streetAddress').value = customer.streetAddress || '';
    document.getElementById('city').value = customer.city || '';
    document.getElementById('state').value = customer.state || '';
    document.getElementById('postalCode').value = customer.postalCode || '';
    document.getElementById('country').value = customer.country || '';
    document.getElementById('addressType').value = customer.addressType || '';
    
    const billingAddressSame = customer.billingAddressSame !== false; // Default to true
    document.getElementById('billingAddressSame').checked = billingAddressSame;
    document.getElementById('billingAddressSection').style.display = billingAddressSame ? 'none' : 'block';
    
    if (!billingAddressSame) {
      document.getElementById('billingStreet').value = customer.billingStreet || '';
      document.getElementById('billingCity').value = customer.billingCity || '';
      document.getElementById('billingState').value = customer.billingState || '';
      document.getElementById('billingPostalCode').value = customer.billingPostalCode || '';
      document.getElementById('billingCountry').value = customer.billingCountry || '';
    }
    
    // Preferences
    document.getElementById('preferredLanguage').value = customer.preferredLanguage || '';
    document.getElementById('communicationFrequency').value = customer.communicationFrequency || '';
    document.getElementById('subscribeNewsletter').checked = customer.subscribeNewsletter || false;
    document.getElementById('marketingConsent').checked = customer.marketingConsent || false;
    document.getElementById('preferredPaymentMethod').value = customer.preferredPaymentMethod || '';
    document.getElementById('creditLimit').value = customer.creditLimit || '';
    document.getElementById('currency').value = customer.currency || '';
    document.getElementById('timezone').value = customer.timezone || '';
    document.getElementById('accountType').value = customer.accountType || '';
    document.getElementById('tags').value = customer.tags || '';
    
    // Aceleradores
    // Clear existing rows and add from data
    const aceleradoresTableBody = document.getElementById('aceleradoresTableBody');
    // Keep only the template row
    Array.from(aceleradoresTableBody.children).forEach(child => {
      if (child.id !== 'aceleradorTemplate') {
        aceleradoresTableBody.removeChild(child);
      }
    });
    
    // Add rows from data
    if (customer.aceleradores && customer.aceleradores.length > 0) {
      customer.aceleradores.forEach(acelerador => {
        addAceleradorRow();
        const newRow = aceleradoresTableBody.lastElementChild;
        
        newRow.querySelector('.acelerador-artefacto').value = acelerador.artefacto || '';
        newRow.querySelector('.acelerador-objetivo').value = acelerador.objetivo || '';
        newRow.querySelector('.acelerador-desarrollo').value = acelerador.desarrollo || '';
        
        // Set multiselect values
        const setMultiselectValues = (selector, values) => {
          if (!values || !Array.isArray(values)) return;
          
          const select = newRow.querySelector(selector);
          Array.from(select.options).forEach(option => {
            option.selected = values.includes(option.value);
          });
        };
        
        setMultiselectValues('.acelerador-technology-base', acelerador.technologyBase);
        setMultiselectValues('.acelerador-technology', acelerador.technology);
        
        // Set checkbox values
        newRow.querySelector('.acelerador-data-ingestion').checked = acelerador.dataIngestion || false;
        newRow.querySelector('.acelerador-data-transformation').checked = acelerador.dataTransformation || false;
        newRow.querySelector('.acelerador-monitoring').checked = acelerador.monitoring || false;
        newRow.querySelector('.acelerador-securitization').checked = acelerador.securitization || false;
        newRow.querySelector('.acelerador-data-modeling').checked = acelerador.dataModeling || false;
        newRow.querySelector('.acelerador-mlops').checked = acelerador.mlops || false;
        newRow.querySelector('.acelerador-cicd').checked = acelerador.cicd || false;
      });
    } else {
      // Add one empty row
      addAceleradorRow();
    }
  }

  // Delete customer
  function deleteCustomer(name) {
    if (!confirm(`Are you sure you want to delete customer "${name}"?`)) {
      return;
    }
    
    google.script.run
      .withSuccessHandler(function(response) {
        if (response.success) {
          alert(response.message);
          loadCustomers();
        } else {
          alert("Error: " + response.message);
        }
      })
      .withFailureHandler(function(error) {
        alert("Error deleting customer: " + error.message);
      })
      .deleteCustomer(name);
  }

  // Reset form
  function resetForm() {
    // Reset global variables
    formData = {};
    isEditing = false;
    currentCustomer = null;
    
    // Reset all form elements
    document.querySelectorAll('form').forEach(form => {
      form.reset();
    });
    
    // Make customer name field editable again
    document.getElementById('customerName').readOnly = false;
    
    // Reset aceleradores
    const aceleradoresTableBody = document.getElementById('aceleradoresTableBody');
    // Keep only the template row
    Array.from(aceleradoresTableBody.children).forEach(child => {
      if (child.id !== 'aceleradorTemplate') {
        aceleradoresTableBody.removeChild(child);
      }
    });
    
    // Add one empty row
    addAceleradorRow();
    
    // Go back to first tab
    const arquitecturaTab = document.getElementById('arquitectura-tab');
    bootstrap.Tab.getOrCreateInstance(arquitecturaTab).show();
  }
</script>

</body>
