
<div class="form-section">
  <h3 class="mb-3">Contact Information</h3>
  <p class="text-muted mb-4">Enter the customer's contact details</p>
  
  <form id="contactInfoForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="phoneNumber" class="form-label">Phone Number</label>
        <input type="tel" class="form-control" id="phoneNumber" placeholder="e.g., +1 (555) 123-4567">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="mobileNumber" class="form-label">Mobile Number</label>
        <input type="tel" class="form-control" id="mobileNumber" placeholder="e.g., +1 (555) 987-6543">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="workPhone" class="form-label">Work Phone</label>
        <input type="tel" class="form-control" id="workPhone" placeholder="e.g., +1 (555) 456-7890">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="alternativeEmail" class="form-label">Alternative Email</label>
        <input type="email" class="form-control" id="alternativeEmail" placeholder="e.g., john.work@example.com">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="preferredContactMethod" class="form-label">Preferred Contact Method</label>
        <select class="form-select" id="preferredContactMethod">
          <option value="" selected>Select contact method</option>
          <option value="email">Email</option>
          <option value="phone">Phone</option>
          <option value="mobile">Mobile</option>
          <option value="mail">Mail</option>
        </select>
      </div>
    </div>
  </form>
</div>

<script>
  // Function to collect contact info data
  function collectContactInfoData() {
    return {
      phoneNumber: document.getElementById('phoneNumber').value,
      mobileNumber: document.getElementById('mobileNumber').value,
      workPhone: document.getElementById('workPhone').value,
      alternativeEmail: document.getElementById('alternativeEmail').value,
      preferredContactMethod: document.getElementById('preferredContactMethod').value
    };
  }
</script>
