
<div class="form-section">
  <h3 class="section-header">
    <span>
      <i class="bi bi-speedometer2"></i> Aceleradores
    </span>
  </h3>
  <div class="content">
    <div class="mb-4">
      <p class="text-muted mb-3">Ingrese información sobre artefactos y aceleradores utilizados:</p>

      <div class="table-responsive">
        <table class="table table-bordered table-striped" id="aceleradoresTable">
          <thead class="table-primary">
            <tr>
              <th style="min-width: 150px">Artefacto</th>
              <th style="min-width: 200px">Objetivo</th>
              <th style="min-width: 180px">
                ¿Desarrollado de cero o adaptado?
              </th>
              <th style="min-width: 200px">
                Main Technology del prototipo base
                <i class="bi bi-question-circle ms-1" data-bs-toggle="tooltip" 
                   title="Si estamos partiendo de un artefactado de Data Tech, la tecnología sobre la que está diseñado."></i>
              </th>
              <th style="min-width: 200px">
                Main Technology del prototipo
                <i class="bi bi-question-circle ms-1" data-bs-toggle="tooltip" 
                   title="Puede que el artefacto adaptado esté diseñado en una tecnologia, pero en nuestro proyecto se haya cambiado a otra"></i>
              </th>
              <th class="text-center" style="width: 100px">Data Ingestion</th>
              <th class="text-center" style="width: 100px">Data Transformation</th>
              <th class="text-center" style="width: 100px">Monitoring</th>
              <th class="text-center" style="width: 100px">Securitization</th>
              <th class="text-center" style="width: 100px">Data Modeling</th>
              <th class="text-center" style="width: 100px">MLOps</th>
              <th class="text-center" style="width: 100px">CICD</th>
              <th class="text-center" style="width: 80px">Acciones</th>
            </tr>
          </thead>
          <tbody id="aceleradoresTableBody">
            <tr id="aceleradorTemplate" style="display:none">
              <td>
                <input type="text" class="form-control acelerador-artefacto" placeholder="Nombre del artefacto">
              </td>
              <td>
                <textarea class="form-control acelerador-objetivo" placeholder="Objetivo del artefacto" rows="2"></textarea>
              </td>
              <td>
                <select class="form-select acelerador-desarrollo">
                  <option value="">Seleccionar...</option>
                  <option value="Desarrollado">Desarrollado</option>
                  <option value="Desde Cero">Desde Cero</option>
                </select>
              </td>
              <td>
                <input type="text" class="form-control acelerador-technology-base" placeholder="Ingrese la tecnología base">
              </td>
              <td>
                <input type="text" class="form-control acelerador-technology" placeholder="Ingrese la tecnología">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-data-ingestion">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-data-transformation">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-monitoring">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-securitization">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-data-modeling">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-mlops">
              </td>
              <td class="text-center">
                <input type="checkbox" class="form-check-input acelerador-cicd">
              </td>
              <td class="text-center">
                <button type="button" class="btn btn-outline-danger btn-sm delete-acelerador">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <button type="button" class="btn btn-success mt-3" id="addAceleradorBtn">
        <i class="bi bi-plus-circle"></i> Agregar Acelerador
      </button>
    </div>
  </div>
</div>

<script>
  let aceleradorCounter = 0;

  function addAceleradorRow() {
    aceleradorCounter++;
    
    const template = document.getElementById('aceleradorTemplate');
    const newRow = template.cloneNode(true);
    newRow.id = 'acelerador-' + aceleradorCounter;
    newRow.style.display = '';
    
    const deleteBtn = newRow.querySelector('.delete-acelerador');
    deleteBtn.onclick = function() {
      document.getElementById('aceleradoresTableBody').removeChild(newRow);
    };
    
    document.getElementById('aceleradoresTableBody').appendChild(newRow);
  }

  function collectAceleradoresData() {
    const aceleradores = [];
    const rows = document.querySelectorAll('#aceleradoresTableBody tr:not([style*="display:none"])');
    
    rows.forEach(row => {
      if (row.id === 'aceleradorTemplate') return;
      
      const acelerador = {
        artefacto: row.querySelector('.acelerador-artefacto').value,
        objetivo: row.querySelector('.acelerador-objetivo').value,
        desarrollo: row.querySelector('.acelerador-desarrollo').value,
        technologyBase: row.querySelector('.acelerador-technology-base').value,
        technology: row.querySelector('.acelerador-technology').value,
        dataIngestion: row.querySelector('.acelerador-data-ingestion').checked,
        dataTransformation: row.querySelector('.acelerador-data-transformation').checked,
        monitoring: row.querySelector('.acelerador-monitoring').checked,
        securitization: row.querySelector('.acelerador-securitization').checked,
        dataModeling: row.querySelector('.acelerador-data-modeling').checked,
        mlops: row.querySelector('.acelerador-mlops').checked,
        cicd: row.querySelector('.acelerador-cicd').checked
      };
      
      aceleradores.push(acelerador);
    });
    
    return aceleradores;
  }

  document.addEventListener('DOMContentLoaded', function() {
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function(tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });
    
    document.getElementById('addAceleradorBtn').addEventListener('click', addAceleradorRow);
    addAceleradorRow();
  });
</script>
