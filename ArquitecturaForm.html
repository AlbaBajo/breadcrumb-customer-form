<script>
  // Initialize collapsible sections
  document.addEventListener('DOMContentLoaded', function() {
    const collapsibles = document.querySelectorAll('.collapsible');
    
    collapsibles.forEach(collapsible => {
      collapsible.addEventListener('click', function() {
        this.classList.toggle('active');
        const content = this.nextElementSibling;
        if (content.classList.contains('hidden')) {
          content.classList.remove('hidden');
        } else {
          content.classList.add('hidden');
        }
      });
    });
  });
  
  // Fix for PHP-style loops since Apps Script doesn't support PHP
  document.addEventListener('DOMContentLoaded', function() {
    // Replace <?php and <?= tags with proper HTML content for checkboxes
    const techETLOptions = ["Databricks", "Talend", "Data Factory", "Informatica (IICS)", "Confluent", "Kestra", "Aecorsoft", "Streamsets", "Capstorm", "Custom Python Scripts", "Glue Jobs", "Qlik Replicate"];
    
    // For Sources to DL Tech ETL
    let sourcesContainer = document.querySelector("[id^='sourcesToDLTechETL']").closest('.border');
    sourcesContainer.innerHTML = '';
    
    techETLOptions.forEach((option, index) => {
      const checkboxDiv = document.createElement('div');
      checkboxDiv.className = 'form-check';
      checkboxDiv.innerHTML = `
        <input class="form-check-input" type="checkbox" id="sourcesToDLTechETL${index}" name="sourcesToDLTechETL" value="${option}">
        <label class="form-check-label" for="sourcesToDLTechETL${index}">${option}</label>
      `;
      sourcesContainer.appendChild(checkboxDiv);
    });
    
    // For DL to DWH Tech ETL
    let dlToDWHContainer = document.querySelector("[id^='dlToDWHTechETL']").closest('.border');
    dlToDWHContainer.innerHTML = '';
    
    techETLOptions.forEach((option, index) => {
      const checkboxDiv = document.createElement('div');
      checkboxDiv.className = 'form-check';
      checkboxDiv.innerHTML = `
        <input class="form-check-input" type="checkbox" id="dlToDWHTechETL${index}" name="dlToDWHTechETL" value="${option}">
        <label class="form-check-label" for="dlToDWHTechETL${index}">${option}</label>
      `;
      dlToDWHContainer.appendChild(checkboxDiv);
    });
  });
  
  // Helper function to collect form data
  function collectArquitecturaData() {
    const data = {
      customerName: document.getElementById('customerName').value,
      antiguedad: document.getElementById('antiguedad').value,
      tipoLicencia: document.getElementById('tipoLicencia').value,
      cloud: document.getElementById('cloud').value,
      tallaje: document.querySelector('input[name="tallaje"]:checked')?.value || '',
      comments: document.getElementById('comments').value,
      
      // Data Ingestion - Sources to DL
      sourcesToDLSDG: document.getElementById('sourcesToDLSDG').checked,
      sourcesToDLTechETL: Array.from(document.querySelectorAll('input[name="sourcesToDLTechETL"]:checked')).map(el => el.value),
      storageDL: document.getElementById('storageDL').value,
      sourcesToDLComments: document.getElementById('sourcesToDLComments').value,
      
      // Data Ingestion - DL to DWH
      dlToDWHSDG: document.getElementById('dlToDWHSDG').checked,
      dataModel: document.getElementById('dataModel').value,
      dlToDWHTechETL: Array.from(document.querySelectorAll('input[name="dlToDWHTechETL"]:checked')).map(el => el.value),
      storageDWH: document.getElementById('storageDWH').value,
      dlToDWHComments: document.getElementById('dlToDWHComments').value,
      
      // Explotación del Dato
      capaExplotacion: Array.from(document.querySelectorAll('input[name="capaExplotacion"]:checked')).map(el => el.value),
      explotacionDatoComments: document.getElementById('explotacionDatoComments').value,
      
      // Orquestación
      orquestacionTech: Array.from(document.querySelectorAll('input[name="orquestacionTech"]:checked')).map(el => el.value),
      orquestacionComments: document.getElementById('orquestacionComments').value,
      
      // Visualization
      visualizationTech: Array.from(document.querySelectorAll('input[name="visualizationTech"]:checked')).map(el => el.value),
      ratioDashboardsSnowflake: document.getElementById('ratioDashboardsSnowflake').value,
      visualizationComments: document.getElementById('visualizationComments').value,
      
      // Advanced Analytics
      isDoingSomething: document.getElementById('isDoingSomething').checked,
      advancedAnalyticsTech: Array.from(document.querySelectorAll('input[name="advancedAnalyticsTech"]:checked')).map(el => el.value),
      advancedAnalyticsComments: document.getElementById('advancedAnalyticsComments').value,
      
      // Government
      governmentTech: Array.from(document.querySelectorAll('input[name="governmentTech"]:checked')).map(el => el.value),
      governmentComments: document.getElementById('governmentComments').value
    };
    
    return data;
  }
  
  // Function to validate required fields
  function validateArquitecturaForm() {
    let isValid = true;
    
    // Check required fields
    if (!document.getElementById('customerName').value.trim()) {
      document.getElementById('customerName').classList.add('is-invalid');
      isValid = false;
    } else {
      document.getElementById('customerName').classList.remove('is-invalid');
    }
    
    if (!document.getElementById('antiguedad').value.trim()) {
      document.getElementById('antiguedad').classList.add('is-invalid');
      isValid = false;
    } else {
      document.getElementById('antiguedad').classList.remove('is-invalid');
    }
    
    return isValid;
  }
</script>
