
<div class="form-section">
  <h3 class="mb-3">Business Information</h3>
  <p class="text-muted mb-4">Enter the customer's business details</p>
  
  <form id="businessInfoForm">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="companyName" class="form-label">Company Name</label>
        <input type="text" class="form-control" id="companyName" placeholder="e.g., Acme Corporation">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="businessType" class="form-label">Business Type</label>
        <select class="form-select" id="businessType">
          <option value="" selected>Select business type</option>
          <option value="sole-proprietorship">Sole Proprietorship</option>
          <option value="partnership">Partnership</option>
          <option value="llc">LLC</option>
          <option value="corporation">Corporation</option>
          <option value="non-profit">Non-Profit</option>
        </select>
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="industry" class="form-label">Industry</label>
        <input type="text" class="form-control" id="industry" placeholder="e.g., Technology">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="annualRevenue" class="form-label">Annual Revenue</label>
        <input type="text" class="form-control" id="annualRevenue" placeholder="e.g., $1,000,000">
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="numberOfEmployees" class="form-label">Number of Employees</label>
        <input type="number" class="form-control" id="numberOfEmployees" placeholder="e.g., 50">
      </div>
    </div>
  </form>
</div>

<script>
  // Function to collect business info data
  function collectBusinessInfoData() {
    return {
      companyName: document.getElementById('companyName').value,
      businessType: document.getElementById('businessType').value,
      industry: document.getElementById('industry').value,
      annualRevenue: document.getElementById('annualRevenue').value,
      numberOfEmployees: document.getElementById('numberOfEmployees').value
    };
  }
</script>
