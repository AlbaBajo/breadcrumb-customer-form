  <body>
    <div class="container-fluid">
      <h1 class="mb-4 text-center text-primary">Customer Information System</h1>
      
      <ul class="nav nav-tabs" id="mainTabs">
        <li class="nav-item">
          <a class="nav-link active" id="form-tab" data-bs-toggle="tab" href="#formSection">Formulario</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="table-tab" data-bs-toggle="tab" href="#customerTable">Tabla de Clientes</a>

          <a class="nav-link" id="report-tab" data-bs-toggle="tab" href="#reportSection">Reportes</a>

      </ul>
      
      <div class="tab-content w-100">
        <!-- Form Section -->
        <div class="tab-pane fade show active" id="formSection">
          <div id="formSteps">
            <!-- Step navigation -->
            <ul class="nav nav-pills mb-4" id="stepTabs">
              <li class="nav-item">
                <a class="nav-link active" id="arquitectura-tab" data-bs-toggle="pill" href="#arquitecturaStep">Arquitectura</a>

              <li class="nav-item">

              <li class="nav-item">
                <a class="nav-link" id="aceleradores-tab" data-bs-toggle="pill" href="#aceleradoresStep">Aceleradores</a>

              <li class="nav-item">
                <a class="nav-link" id="contact-tab" data-bs-toggle="pill" href="#contactStep">Contact Info</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" id="review-tab" data-bs-toggle="pill" href="#reviewStep">Review</a>
              </li>
            </ul>
            
            <!-- Step content -->
            <div class="tab-content w-100">
              <!-- Arquitectura Step -->
              <div class="tab-pane fade show active" id="arquitecturaStep">
                <?!= include('ArquitecturaForm'); ?>

              <!-- Features Step -->
              <div class="tab-pane fade" id="featuresStep">
                <?!= include('FeaturesForm'); ?>

              <!-- Aceleradores Step -->
              <div class="tab-pane fade" id="aceleradoresStep">
                <?!= include('Aceleradores'); ?>
              </div>
              
              <!-- Contact Info Step -->
              <div class="tab-pane fade" id="contactStep">
                <?!= include('ContactInfoForm'); ?>

              <!-- Review Step -->
              <div class="tab-pane fade" id="reviewStep">

            <!-- Navigation buttons -->
            <div class="d-flex justify-content-between mt-4">
              <button id="prevButton" class="btn btn-secondary" onclick="prevStep()" disabled>Previous</button>

        <!-- Reports Section -->
        <div class="tab-pane fade" id="reportSection">
          <h3 class="mb-3">Reportes</h3>
          
          <div class="row">
            <!-- Arquitectura Reports -->
            <div class="col-md-6">

                  <i class="bi bi-building"></i> Arquitectura

                  <div class="chart-container" id="cloudDistributionChart"></div>
                  <div class="chart-container" id="licenseDistributionChart"></div>

            <!-- Features Reports -->

              <div class="card">

                  <div class="chart-container" id="sourceFormatChart"></div>

            <!-- Aceleradores Reports -->
            <div class="col-12 mt-4">

                <div class="card-header">
                  <i class="bi bi-speedometer2"></i> Aceleradores
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-6">
                      <div class="chart-container" id="aceleradoresTypeChart"></div>
                    </div>
                    <div class="col-md-6">
                      <div class="chart-container" id="aceleradoresCategoryChart"></div>
                    </div>

                  <div class="chart-container" id="aceleradoresTechnologyChart"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script>
      // Global object to store form data
      let formData = {};
      
      // Current step index
      let currentStepIndex = 0;
      const steps = ['arquitecturaStep', 'featuresStep', 'aceleradoresStep', 'contactStep', 'reviewStep'];
      const tabIds = ['arquitectura-tab', 'features-tab', 'aceleradores-tab', 'contact-tab', 'review-tab'];
      
      // Navigation functions
      function nextStep() {
        // Validate current step if needed
        if (currentStepIndex === 0) {
          if (!validateArquitecturaForm()) {
            alert('Please fill in all required fields.');
            return;
          }
        }
        
        // Save data from current step
        saveCurrentStepData();
        
        // If we're on the last step, show the review instead
        if (currentStepIndex < steps.length - 1) {
          document.getElementById(tabIds[currentStepIndex]).classList.remove('active');
          document.getElementById(steps[currentStepIndex]).classList.remove('show', 'active');
          
          currentStepIndex++;
          
          document.getElementById(tabIds[currentStepIndex]).classList.add('active');
          document.getElementById(steps[currentStepIndex]).classList.add('show', 'active');
          
          updateButtonsState();
          
          if (currentStepIndex === steps.length - 1) {
            populateReviewScreen();
          }
        }
      }
      
      function prevStep() {
        if (currentStepIndex > 0) {
          document.getElementById(tabIds[currentStepIndex]).classList.remove('active');
          document.getElementById(steps[currentStepIndex]).classList.remove('show', 'active');
          
          currentStepIndex--;
          
          document.getElementById(tabIds[currentStepIndex]).classList.add('active');
          document.getElementById(steps[currentStepIndex]).classList.add('show', 'active');
          
          updateButtonsState();
        }
      }
      
      function updateButtonsState() {
        // Enable/disable Previous button
        document.getElementById('prevButton').disabled = currentStepIndex === 0;
        
        // Show/hide Next and Submit buttons
        if (currentStepIndex === steps.length - 1) {
          document.getElementById('nextButton').style.display = 'none';
          document.getElementById('submitButton').style.display = 'block';
        } else {
          document.getElementById('nextButton').style.display = 'block';
          document.getElementById('submitButton').style.display = 'none';
        }
      }
      
      // Function to save form data from the current step
      function saveCurrentStepData() {
        switch (steps[currentStepIndex]) {
          case 'arquitecturaStep':
            // Use the collect data function from ArquitecturaForm
            const arquitecturaData = collectArquitecturaData();
            formData = {...formData, ...arquitecturaData};
            break;
            
          case 'featuresStep':
            // Use the collect data function from FeaturesForm
            const featuresData = collectFeaturesData();
            formData = {...formData, ...featuresData};
            break;
            
          case 'aceleradoresStep':
            // Collect aceleradores data
            formData.aceleradores = collectAceleradoresData();
            break;
            
          case 'contactStep':
            formData.phoneNumber = document.getElementById('phoneNumber')?.value || '';
            formData.mobileNumber = document.getElementById('mobileNumber')?.value || '';
            formData.workPhone = document.getElementById('workPhone')?.value || '';
            formData.alternativeEmail = document.getElementById('alternativeEmail')?.value || '';
            formData.preferredContactMethod = document.getElementById('preferredContactMethod')?.value || '';
            break;
        }
      }
      
      // Submit form data
      function submitForm() {
        // Show loading state
        document.getElementById('submitButton').disabled = true;
        document.getElementById('submitButton').innerHTML = 'Saving...';
        
        // Call server-side function
        google.script.run
          .withSuccessHandler(onFormSubmitSuccess)
          .withFailureHandler(onFormSubmitError)
          .saveCustomerData(formData);
      }
      
      function onFormSubmitSuccess(response) {
        document.getElementById('submitButton').disabled = false;
        document.getElementById('submitButton').innerHTML = 'Submit';
        
        if (response.success) {
          alert('Form submitted successfully!');
          // Switch to customer table view
          document.getElementById('table-tab').click();
          loadCustomerTable();
          // Reset form
          resetForm();
        } else {
          alert('Error: ' + response.message);
        }
      }
      
      function onFormSubmitError(error) {
        document.getElementById('submitButton').disabled = false;
        document.getElementById('submitButton').innerHTML = 'Submit';
        alert('Error: ' + error.message);
      }
      
      // Reset form
      function resetForm() {
        // Reset form data
        formData = {};
        // Reset to first step
        currentStepIndex = 0;
        // Reset form elements
        document.querySelectorAll('form').forEach(form => form.reset());
        // Reset aceleradores table
        const aceleradoresBody = document.getElementById('aceleradoresTableBody');
        const template = document.getElementById('aceleradorTemplate');
        if (aceleradoresBody && template) {
          // Remove all rows except template
          Array.from(aceleradoresBody.children).forEach(child => {
            if (child.id !== 'aceleradorTemplate') {
              aceleradoresBody.removeChild(child);
            }
          });
          // Add one row
          addAceleradorRow();
        }
        // Update UI
        document.getElementById(tabIds[0]).click();
        updateButtonsState();
      }
      
      // Load customer table data
      function loadCustomerTable() {
        google.script.run
          .withSuccessHandler(displayCustomerData)
          .withFailureHandler(function(error) {
            alert('Error loading customer data: ' + error.message);
          })
          .getAllCustomers();
      }
      
      function displayCustomerData(customers) {
        if (!customers || customers.length === 0) {
          document.getElementById('tableBody').innerHTML = '<tr><td colspan="16" class="text-center">No data available</td></tr>';
          return;
        }
        
        // Get headers (keys from the first customer object)
        const headers = Object.keys(customers[0]);
        
        // Create header row
        let headerRow = '';
        headers.forEach(header => {
          headerRow += `<th>${header}</th>`;
        });
        document.getElementById('tableHeader').innerHTML = headerRow;
        
        // Create data rows
        let tableBody = '';
        customers.forEach(customer => {
          let row = '<tr>';
          headers.forEach(header => {
            let cellContent = '';
            
            // Special handling for Aceleradores
            if (header === 'Aceleradores' && Array.isArray(customer[header])) {
              cellContent = `<span class="badge bg-info">${customer[header].length} items</span>`;
            } else {
              cellContent = customer[header] || '';
            }
            
            row += `<td>${cellContent}</td>`;
          });
          row += '</tr>';
          tableBody += row;
        });
        document.getElementById('tableBody').innerHTML = tableBody;
      }
      
      // Load and display reports
      function loadReports() {
        google.script.run
          .withSuccessHandler(displayReports)
          .withFailureHandler(function(error) {
            alert('Error loading reports: ' + error.message);
          })
          .generateReports();
      }
      
      function displayReports(reports) {
        // Helper function to create charts
        function createChart(elementId, type, labels, data, title) {
          const ctx = document.getElementById(elementId).getContext('2d');
          new Chart(ctx, {
            type: type,
            data: {
              labels: labels,
              datasets: [{
                label: title,
                data: data,
                backgroundColor: [
                  '#7e69ab', '#9b87f5', '#6e59a5', '#e5deff', '#d3e4fd',
                  '#fde1d3', '#ffdee2', '#f2fce2', '#fef7cd', '#fec6a1'
                ],
                borderWidth: 1
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                title: {
                  display: true,
                  text: title
                }
              }
            }
          });
        }
        
        // Arquitectura charts
        if (reports.arquitectura) {
          // Cloud distribution
          const cloudLabels = Object.keys(reports.arquitectura.cloudDistribution);
          const cloudData = cloudLabels.map(key => reports.arquitectura.cloudDistribution[key]);
          createChart('cloudDistributionChart', 'pie', cloudLabels, cloudData, 'Cloud Distribution');
          
          // License type distribution
          const licenseLabels = Object.keys(reports.arquitectura.tipoLicenciaDistribution);
          const licenseData = licenseLabels.map(key => reports.arquitectura.tipoLicenciaDistribution[key]);
          createChart('licenseDistributionChart', 'bar', licenseLabels, licenseData, 'License Type Distribution');
        }
        
        // Features charts
        if (reports.features) {
          // Sources distribution
          const sourcesLabels = Object.keys(reports.features.sourcesDistribution);
          const sourcesData = sourcesLabels.map(key => reports.features.sourcesDistribution[key]);
          createChart('sourcesDistributionChart', 'bar', sourcesLabels, sourcesData, 'Data Sources Distribution');
          
          // Source format distribution
          const formatLabels = Object.keys(reports.features.sourceFormatDistribution);
          const formatData = formatLabels.map(key => reports.features.sourceFormatDistribution[key]);
          createChart('sourceFormatChart', 'pie', formatLabels, formatData, 'Source Format Distribution');
        }
        
        // Aceleradores charts
        if (reports.aceleradores) {
          // Development type distribution
          const typeLabels = Object.keys(reports.aceleradores.typeDistribution);
          const typeData = typeLabels.map(key => reports.aceleradores.typeDistribution[key]);
          createChart('aceleradoresTypeChart', 'pie', typeLabels, typeData, 'Development Type Distribution');
          
          // Categories distribution
          const categoryLabels = Object.keys(reports.aceleradores.categoriesDistribution);
          const categoryData = categoryLabels.map(key => reports.aceleradores.categoriesDistribution[key]);
          createChart('aceleradoresCategoryChart', 'bar', categoryLabels, categoryData, 'Categories Distribution');
          
          // Technology distribution
          const techLabels = Object.keys(reports.aceleradores.technologyDistribution);
          const techData = techLabels.map(key => reports.aceleradores.technologyDistribution[key]);
          createChart('aceleradoresTechnologyChart', 'horizontalBar', techLabels, techData, 'Technology Distribution');
        }
      }
      
      // Initialize tabs with Bootstrap
      document.addEventListener('DOMContentLoaded', function() {
        // Set up tab events
        document.getElementById('table-tab').addEventListener('click', function() {
          loadCustomerTable();
        });
        
        document.getElementById('report-tab').addEventListener('click', function() {
          loadReports();
        });
        
        // Initialize tooltips if there are any in the form
        if (typeof bootstrap !== 'undefined' && typeof bootstrap.Tooltip !== 'undefined') {
          var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
          tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
          });
        }
      });
    </script>
  </body>
