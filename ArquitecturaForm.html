
<div class="form-section">
  <h3 class="mb-3">Arquitectura</h3>
  <p class="text-muted mb-4">Enter the customer architecture details</p>
  
  <form id="arquitecturaForm">
    <!-- Required fields at the top -->
    <div class="row mb-4">
      <div class="col-md-6 mb-3">
        <label for="customerName" class="form-label required-field">Customer Name</label>
        <input type="text" class="form-control" id="customerName" placeholder="Enter customer name" required>
      </div>
      
      <div class="col-md-6 mb-3">
        <label for="antiguedad" class="form-label required-field">Antiguedad</label>
        <input type="text" class="form-control" id="antiguedad" placeholder="Enter antiguedad" required>
      </div>
    </div>
    
    <!-- Snowflake Section - Non-collapsible -->
    <div class="section-header">
      <h4 class="mb-3">Edition Snowflake</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-4 mb-3">
          <label for="tipoLicencia" class="form-label">Tipo Licencia</label>
          <select class="form-select" id="tipoLicencia">
            <option value="" selected>Select license type</option>
            <option value="Standard">Standard</option>
            <option value="Enterprise">Enterprise</option>
            <option value="BusinessCritical">Business Critical</option>
            <option value="VPS">VPS</option>
            <option value="Desconocido">Desconocido</option>
          </select>
        </div>
        
        <div class="col-md-4 mb-3">
          <label for="cloud" class="form-label">Cloud</label>
          <select class="form-select" id="cloud">
            <option value="" selected>Select cloud provider</option>
            <option value="AWS">AWS</option>
            <option value="Google">Google</option>
            <option value="AZURE">AZURE</option>
          </select>
        </div>
        
        <div class="col-md-4 mb-3">
          <label class="form-label d-block">Tallaje</label>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tallaje" id="tallajeXS" value="XS">
            <label class="form-check-label" for="tallajeXS">XS</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tallaje" id="tallajeS" value="S">
            <label class="form-check-label" for="tallajeS">S</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tallaje" id="tallajeM" value="M">
            <label class="form-check-label" for="tallajeM">M</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tallaje" id="tallajeL" value="L">
            <label class="form-check-label" for="tallajeL">L</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="tallaje" id="tallajeXL" value="XL">
            <label class="form-check-label" for="tallajeXL">XL</label>
          </div>
        </div>
      </div>
      
      <div class="row">
        <div class="col-md-12 mb-3">
          <label for="comments" class="form-label">Comments</label>
          <textarea class="form-control" id="comments" rows="3" placeholder="Add any additional comments"></textarea>
        </div>
      </div>
    </div>
    
    <!-- Data Ingestion Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Data Ingestion</h4>
    </div>
    <div class="content">
      <div class="container-fluid mt-3">
        <div class="row">
          <!-- Left Column: From Sources to DL -->
          <div class="col-md-6 mb-3">
            <h5>From Sources to DL</h5>
            
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="sourcesToDLSDG">
                <label class="form-check-label" for="sourcesToDLSDG">SDG</label>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Tech ETL</label>
                <div class="border p-2 rounded" style="max-height: 150px; overflow-y: auto;" id="sourcesToDLTechETLContainer">
                  <!-- Tech ETL checkboxes will be dynamically added here -->
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="storageDL" class="form-label">Storage DL</label>
                <select class="form-select" id="storageDL">
                  <option value="" selected>Select storage</option>
                  <option value="AWS S3">AWS S3</option>
                  <option value="ADLS">ADLS</option>
                  <option value="Confluent">Confluent</option>
                  <option value="Snowflake">Snowflake</option>
                </select>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="sourcesToDLComments" class="form-label">Comments</label>
              <textarea class="form-control" id="sourcesToDLComments" rows="3" placeholder="Add any comments"></textarea>
            </div>
          </div>
          
          <!-- Right Column: From DL to DWH -->
          <div class="col-md-6 mb-3">
            <h5>From DL to DWH</h5>
            
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="dlToDWHSDG">
                  <label class="form-check-label" for="dlToDWHSDG">SDG</label>
                </div>
              </div>
              
              <div class="col-md-6">
                <label for="dataModel" class="form-label">Data Model</label>
                <select class="form-select" id="dataModel">
                  <option value="" selected>Select data model</option>
                  <option value="Kimball">Kimball</option>
                  <option value="Data Vault">Data Vault</option>
                  <option value="Tablones">Tablones</option>
                  <option value="Desconocido">Desconocido</option>
                </select>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Tech ETL</label>
                <div class="border p-2 rounded" style="max-height: 150px; overflow-y: auto;" id="dlToDWHTechETLContainer">
                  <!-- Tech ETL checkboxes will be dynamically added here -->
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="storageDWH" class="form-label">Storage DWH</label>
                <select class="form-select" id="storageDWH">
                  <option value="" selected>Select storage</option>
                  <option value="AWS S3">AWS S3</option>
                  <option value="ADLS">ADLS</option>
                  <option value="Confluent">Confluent</option>
                  <option value="Snowflake">Snowflake</option>
                </select>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="dlToDWHComments" class="form-label">Comments</label>
              <textarea class="form-control" id="dlToDWHComments" rows="3" placeholder="Add any comments"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Explotación del Dato Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Explotación del Dato</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-6 mb-3">
          <label class="form-label">Capa Explotación diseñada en Snowflake (Data Model - Tablones)</label>
          <div class="border p-2 rounded mb-3" id="capaExplotacionContainer">
            <!-- Capa Explotacion checkboxes will be dynamically added here -->
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="explotacionDatoComments" class="form-label">Comments</label>
          <textarea class="form-control" id="explotacionDatoComments" rows="5" placeholder="Add any comments"></textarea>
        </div>
      </div>
    </div>
    
    <!-- Orquestación Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Orquestación</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-6 mb-3">
          <label class="form-label">Tech</label>
          <div class="border p-2 rounded mb-3" id="orquestacionTechContainer">
            <!-- Orquestacion Tech checkboxes will be dynamically added here -->
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="orquestacionComments" class="form-label">Comments</label>
          <textarea class="form-control" id="orquestacionComments" rows="5" placeholder="Add any comments"></textarea>
        </div>
      </div>
    </div>
    
    <!-- Visualization Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Visualization</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-6 mb-3">
          <label class="form-label">Tech</label>
          <div class="border p-2 rounded mb-3" id="visualizationTechContainer">
            <!-- Visualization Tech checkboxes will be dynamically added here -->
          </div>
          
          <div class="mb-3">
            <label for="ratioDashboardsSnowflake" class="form-label">Ratio de dashboards leen de Snowflake</label>
            <input type="text" class="form-control" id="ratioDashboardsSnowflake" placeholder="Enter ratio">
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="visualizationComments" class="form-label">Comments</label>
          <textarea class="form-control" id="visualizationComments" rows="5" placeholder="Add any comments"></textarea>
        </div>
      </div>
    </div>
    
    <!-- Advanced Analytics Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Advanced Analytics</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-6 mb-3">
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="isDoingSomething">
            <label class="form-check-label" for="isDoingSomething">¿Están hacienda algo?</label>
          </div>
          
          <label class="form-label">Tech</label>
          <div class="border p-2 rounded mb-3" id="advancedAnalyticsTechContainer">
            <!-- Advanced Analytics Tech checkboxes will be dynamically added here -->
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="advancedAnalyticsComments" class="form-label">Comments</label>
          <textarea class="form-control" id="advancedAnalyticsComments" rows="5" placeholder="Add any comments"></textarea>
        </div>
      </div>
    </div>
    
    <!-- Government Section - Non-collapsible -->
    <div class="section-header mt-4">
      <h4 class="mb-3">Government</h4>
    </div>
    <div class="content">
      <div class="row mt-3">
        <div class="col-md-6 mb-3">
          <label class="form-label">Tech</label>
          <div class="border p-2 rounded mb-3" id="governmentTechContainer">
            <!-- Government Tech checkboxes will be dynamically added here -->
          </div>
        </div>
        
        <div class="col-md-6 mb-3">
          <label for="governmentComments" class="form-label">Comments</label>
          <textarea class="form-control" id="governmentComments" rows="5" placeholder="Add any comments"></textarea>
        </div>
      </div>
    </div>
  </form>
</div>

<script>
  // Initialize form with dynamic checkboxes
  document.addEventListener('DOMContentLoaded', function() {
    // Define checkbox options for different sections
    const techETLOptions = ["Databricks", "Talend", "Data Factory", "Informatica (IICS)", "Confluent", "Kestra", "Aecorsoft", "Streamsets", "Capstorm", "Custom Python Scripts", "Glue Jobs", "Qlik Replicate"];
    const capaExplotacionOptions = ["Modelo Estrella", "Tablones", "Data Model", "Otro"];
    const orquestacionTechOptions = ["Talend", "Kestra", "Airflow", "ADF", "GitLab", "EC2", "Snowflake", "Otro"];
    const visualizationTechOptions = ["Power", "Qlik", "Tableau", "MicroStrategy", "Otro"];
    const advancedAnalyticsTechOptions = ["Databricks", "ML Flow", "Snowflake", "Sagemaker", "Datalku", "Otro"];
    const governmentTechOptions = ["Informatica", "Collibra", "Collate", "Purview", "Herramienta interna Cellnex", "Snowflake", "DBT", "Truedat", "Otro"];
    
    // Helper function to create checkboxes
    function createCheckboxes(containerId, options, name) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      options.forEach((option, index) => {
        const checkboxDiv = document.createElement('div');
        checkboxDiv.className = 'form-check';
        checkboxDiv.innerHTML = `
          <input class="form-check-input" type="checkbox" id="${name}${index}" name="${name}" value="${option}">
          <label class="form-check-label" for="${name}${index}">${option}</label>
        `;
        container.appendChild(checkboxDiv);
      });
    }
    
    // Create checkboxes for all sections
    createCheckboxes('sourcesToDLTechETLContainer', techETLOptions, 'sourcesToDLTechETL');
    createCheckboxes('dlToDWHTechETLContainer', techETLOptions, 'dlToDWHTechETL');
    createCheckboxes('capaExplotacionContainer', capaExplotacionOptions, 'capaExplotacion');
    createCheckboxes('orquestacionTechContainer', orquestacionTechOptions, 'orquestacionTech');
    createCheckboxes('visualizationTechContainer', visualizationTechOptions, 'visualizationTech');
    createCheckboxes('advancedAnalyticsTechContainer', advancedAnalyticsTechOptions, 'advancedAnalyticsTech');
    createCheckboxes('governmentTechContainer', governmentTechOptions, 'governmentTech');
  });
  
  // Helper function to collect form data
  function collectArquitecturaData() {
    const data = {
      customerName: document.getElementById('customerName').value,
      antiguedad: document.getElementById('antiguedad').value,
      tipoLicencia: document.getElementById('tipoLicencia').value,
      cloud: document.getElementById('cloud').value,
      tallaje: document.querySelector('input[name="tallaje"]:checked')?.value || '',
      comments: document.getElementById('comments').value,
      
      // Data Ingestion - Sources to DL
      sourcesToDLSDG: document.getElementById('sourcesToDLSDG').checked,
      sourcesToDLTechETL: Array.from(document.querySelectorAll('input[name="sourcesToDLTechETL"]:checked')).map(el => el.value),
      storageDL: document.getElementById('storageDL').value,
      sourcesToDLComments: document.getElementById('sourcesToDLComments').value,
      
      // Data Ingestion - DL to DWH
      dlToDWHSDG: document.getElementById('dlToDWHSDG').checked,
      dataModel: document.getElementById('dataModel').value,
      dlToDWHTechETL: Array.from(document.querySelectorAll('input[name="dlToDWHTechETL"]:checked')).map(el => el.value),
      storageDWH: document.getElementById('storageDWH').value,
      dlToDWHComments: document.getElementById('dlToDWHComments').value,
      
      // Explotación del Dato
      capaExplotacion: Array.from(document.querySelectorAll('input[name="capaExplotacion"]:checked')).map(el => el.value),
      explotacionDatoComments: document.getElementById('explotacionDatoComments').value,
      
      // Orquestación
      orquestacionTech: Array.from(document.querySelectorAll('input[name="orquestacionTech"]:checked')).map(el => el.value),
      orquestacionComments: document.getElementById('orquestacionComments').value,
      
      // Visualization
      visualizationTech: Array.from(document.querySelectorAll('input[name="visualizationTech"]:checked')).map(el => el.value),
      ratioDashboardsSnowflake: document.getElementById('ratioDashboardsSnowflake').value,
      visualizationComments: document.getElementById('visualizationComments').value,
      
      // Advanced Analytics
      isDoingSomething: document.getElementById('isDoingSomething').checked,
      advancedAnalyticsTech: Array.from(document.querySelectorAll('input[name="advancedAnalyticsTech"]:checked')).map(el => el.value),
      advancedAnalyticsComments: document.getElementById('advancedAnalyticsComments').value,
      
      // Government
      governmentTech: Array.from(document.querySelectorAll('input[name="governmentTech"]:checked')).map(el => el.value),
      governmentComments: document.getElementById('governmentComments').value
    };
    
    return data;
  }
  
  // Function to validate required fields
  function validateArquitecturaForm() {
    let isValid = true;
    
    // Check required fields
    if (!document.getElementById('customerName').value.trim()) {
      document.getElementById('customerName').classList.add('is-invalid');
      isValid = false;
    } else {
      document.getElementById('customerName').classList.remove('is-invalid');
    }
    
    if (!document.getElementById('antiguedad').value.trim()) {
      document.getElementById('antiguedad').classList.add('is-invalid');
      isValid = false;
    } else {
      document.getElementById('antiguedad').classList.remove('is-invalid');
    }
    
    return isValid;
  }
</script>
